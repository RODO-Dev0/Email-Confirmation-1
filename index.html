<!-- Paste into Supabase Dashboard → Authentication → Email Templates → Confirm signup -->
<!-- For the Magic Link template, just change the <h1> text to "Sign in to Streamflix" -->
<div style="background:#0B0E14;padding:40px 20px;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:420px;margin:0 auto;background:#141821;border-radius:12px;overflow:hidden;border:1px solid #282E3C;">
    <tr>
      <td style="padding:32px 32px 8px;text-align:center;">
        <div style="font-size:20px;font-weight:700;color:#F5F3EE;font-family:Georgia,serif;">🎬 Streamflix</div>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 32px 0;text-align:center;">
        <h1 style="color:#F5F3EE;font-size:20px;margin:16px 0 4px;font-family:Georgia,serif;">Confirm your account</h1>
        <p style="color:#8B90A0;font-size:14px;line-height:1.5;margin:0 0 24px;">
          Enter this code in Streamflix to finish signing up. It expires shortly, so don't wait too long.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px;text-align:center;">
        <div style="background:#0B0E14;border:1px solid #282E3C;border-radius:8px;padding:18px;display:inline-block;min-width:200px;">
          <span style="font-size:32px;letter-spacing:10px;color:#E8B84B;font-weight:700;font-family:'Courier New',monospace;">{{ .Token }}</span>
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 32px;text-align:center;">
        <p style="color:#8B90A0;font-size:12px;line-height:1.5;margin:0;">
          Didn't request this? You can safely ignore this email.
        </p>
      </td>
    </tr>
  </table>
</div>
